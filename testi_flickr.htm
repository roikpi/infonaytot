<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="refresh" content="82">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      overflow: hidden;
    }

    /* Overlay container fixed to lower right corner */
    #image-overlay {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 320px;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: #000;
      z-index: 9999;
    }

    #image-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.8s ease-in-out;
    }
  </style>
</head>
<body>

  <!-- Google Slides Embed -->
  <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vQnNk23_ABJ-z4PtTuiKZ0ulY5y4DBUMrLrLxQ4e1oP05RAskLZvAlLIcL41SlbBkWOdjvFXlY1Hl8O/embed?start=true&loop=true&delayms=20000&rm=minimal" 
          allowfullscreen="true" 
          mozallowfullscreen="true" 
          webkitallowfullscreen="true">
  </iframe>

  <!-- Image Overlay -->
  <div id="image-overlay">
    <img id="rotating-img" src="" alt="Rotating Slide" />
  </div>

  <script>
    // List your local image files here
    const images = [
      'images/img1.jpg',
      'images/img2.jpg',
      'images/img3.jpg',
      'images/img4.jpg'
    ];

    const ROTATE_INTERVAL_MS = 6000; // 6 seconds
    let currentIndex = 0;
    const imgElement = document.getElementById('rotating-img');

    function showNextImage() {
      if (images.length === 0) return;
      
      // Smooth fade transition
      imgElement.style.opacity = '0';
      
      setTimeout(() => {
        imgElement.src = images[currentIndex];
        imgElement.style.opacity = '1';
        currentIndex = (currentIndex + 1) % images.length;
      }, 400);
    }

    // Load first image immediately
    showNextImage();

    // Start rotation loop
    setInterval(showNextImage, ROTATE_INTERVAL_MS);
  </script>

</body>
</html>
