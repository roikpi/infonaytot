<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unattended TV Presentation Player</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Prevent scrollbars & hide mouse cursor for TV/Kiosk unattended operation */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      cursor: none;
    }
    
    /* Display cursor on mouse hover for setup/maintenance */
    body:hover {
      cursor: auto;
    }

    /* Pulse animation for live status indicator */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="relative w-full h-full flex flex-col justify-center items-center bg-black overflow-hidden">

  <!-- MAIN SLIDES / WEBSITE IFRAME -->
  <iframe id="presentationFrame" 
    class="absolute inset-0 w-full h-full border-0 z-0 transition-opacity duration-1000 opacity-100" 
    allow="autoplay; encrypted-media; fullscreen"
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
  </iframe>

  <!-- VIDEO OVERLAY CONTAINER -->
  <div id="videoOverlay" 
    class="fixed inset-0 w-full h-full bg-black z-40 flex flex-col items-center justify-center transition-opacity duration-1000 opacity-0 pointer-events-none">
    
    <!-- MP4 Video Element -->
    <video id="html5VideoPlayer" 
      class="w-full h-full object-contain hidden" 
      playsinline 
      preload="auto">
      <source id="videoSource" src="" type="video/mp4">
    </video>

    <!-- YouTube IFrame Target Container -->
    <div id="ytPlayerContainer" class="w-full h-full hidden pointer-events-none">
      <div id="ytPlayer" class="w-full h-full"></div>
    </div>

    <!-- Scheduled Video Break Label -->
    <div id="videoBadge" class="absolute top-6 left-6 z-50 bg-black/80 backdrop-blur-md border border-amber-500/30 px-4 py-2 rounded-full flex items-center space-x-3 opacity-90 shadow-xl">
      <span class="relative flex h-3 w-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
      </span>
      <span class="text-xs font-semibold tracking-wider text-amber-200 uppercase" id="videoBadgeText">Scheduled Video Break</span>
    </div>
  </div>

  <!-- TV KIOSK CORNER STATUS BADGE -->
  <div id="statusBadge" 
    class="fixed bottom-6 right-6 z-30 bg-slate-900/80 backdrop-blur-md border border-slate-800 text-slate-300 px-4 py-2.5 rounded-2xl shadow-2xl flex items-center space-x-3 text-xs font-medium transition-all duration-500 opacity-0">
    <div class="relative flex items-center justify-center">
      <span id="statusDot" class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
      <span id="statusPulse" class="absolute h-4 w-4 rounded-full bg-emerald-500/40 animate-pulse-ring"></span>
    </div>
    <div class="flex flex-col">
      <span id="statusTitle" class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Kiosk Active</span>
      <span id="statusTimer" class="font-mono text-xs text-white font-semibold">Initializing...</span>
    </div>
  </div>

  <!-- UNMUTE NOTIFICATION BADGE -->
  <div id="autoplayNotice" 
    class="fixed top-6 right-6 z-50 bg-indigo-900/90 border border-indigo-500/50 text-indigo-100 px-4 py-2.5 rounded-xl shadow-2xl flex items-center space-x-3 text-xs hidden cursor-pointer"
    onclick="handleUserGestureClick()">
    <i class="fa-solid fa-volume-xmark text-amber-400 text-sm"></i>
    <span>Audio Muted (Click anywhere on screen to enable sound)</span>
  </div>

  <script>
    /* ==========================================================================
       TV KIOSK CONFIGURATION (All options editable inside source code)
       ========================================================================== */
    const CONFIG = {
      // 1. Google Slides or Website Embed URL
      SLIDES_URL: "https://docs.google.com/presentation/d/e/2PACX-1vQnNk23_ABJ-z4PtTuiKZ0ulY5y4DBUMrLrLxQ4e1oP05RAskLZvAlLIcL41SlbBkWOdjvFXlY1Hl8O/embed?start=true&loop=true&delayms=20000&rm=minimal",

      // 2. Hybrid Video Queue (Supports YouTube IDs/URLs & MP4 direct files)
      VIDEO_SOURCES: [
        { type: 'youtube', url: 'https://www.youtube.com/watch?v=QTeAzhe91aM' }
      ],

      // 3. Frequency in MINUTES between video breaks (e.g. 5 = every 5 mins, 0.5 = 30 secs)
      INTERVAL_MINUTES: 0.25,

      // 4. Force video muted mode (MUST be set to true for 100% reliable unattended TV playback)
      MUTE_VIDEO: false,

      // 5. Periodic background slide reload in HOURS to prevent browser memory leaks on TV
      RELOAD_SLIDES_INTERVAL_HOURS: 6,

      // 6. UI Controls
      SHOW_CORNER_INDICATOR: true, // Display small countdown badge in bottom-right
      AUTO_START: true             // Auto-start countdown immediately on launch
    };

    /* ==========================================================================
       KIOSK STATE MANAGEMENT & YOUTUBE API SETUP
       ========================================================================== */
    const state = {
      countdownSeconds: Math.round(CONFIG.INTERVAL_MINUTES * 60),
      timerId: null,
      slidesRefreshTimerId: null,
      currentVideoIndex: 0,
      isOverlayActive: false,
      userInteracted: false,
      ytPlayerReady: false,
      ytPlayer: null,
      activePlayerType: null, // 'mp4' or 'youtube'
      safetyTimeoutId: null
    };

    const elements = {
      iframe: document.getElementById('presentationFrame'),
      overlay: document.getElementById('videoOverlay'),
      mp4Player: document.getElementById('html5VideoPlayer'),
      mp4Source: document.getElementById('videoSource'),
      ytContainer: document.getElementById('ytPlayerContainer'),
      videoBadge: document.getElementById('videoBadge'),
      videoBadgeText: document.getElementById('videoBadgeText'),
      statusBadge: document.getElementById('statusBadge'),
      statusDot: document.getElementById('statusDot'),
      statusPulse: document.getElementById('statusPulse'),
      statusTitle: document.getElementById('statusTitle'),
      statusTimer: document.getElementById('statusTimer'),
      autoplayNotice: document.getElementById('autoplayNotice')
    };

    // Asynchronously inject YouTube IFrame API Script
    const ytScript = document.createElement('script');
    ytScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(ytScript);

    // Global YouTube API Ready Callback
    function onYouTubeIframeAPIReady() {
      state.ytPlayer = new YT.Player('ytPlayer', {
        height: '100%',
        width: '100%',
        playerVars: {
          'autoplay': 1,           // Mandatory for unattended operation
          'mute': 0,               // CRITICAL: Mute initial payload to guarantee unattended autoplay
          'controls': 0,           // Hide video controls for kiosk
          'disablekb': 1,          // Disable keyboard interaction
          'enablejsapi': 1,        // Enable JS API control
          'fs': 0,                 // Hide full screen button
          'modestbranding': 1,     // Minimal YouTube branding
          'rel': 0,                // Do not show related videos
          'showinfo': 0,           // Hide info bar
          'iv_load_policy': 3,     // Hide annotations
          'playsinline': 1         // Inline playback for webviews/Smart TVs
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      state.ytPlayerReady = true;
      console.log('[TV Kiosk] YouTube IFrame API successfully initialized.');
    }

    function onPlayerStateChange(event) {
      // YT.PlayerState.PLAYING === 1
      if (event.data === YT.PlayerState.PLAYING) {
        clearSafetyTimeout();
        
        // Attempt unmuting if requested by configuration or if user interacted with screen
        if (!CONFIG.MUTE_VIDEO || state.userInteracted) {
          try {
            state.ytPlayer.unMute();
          } catch (err) {
            console.warn('[TV Kiosk] Audio unmute blocked by browser policy. Remaining muted.', err);
          }
        }
      }

      // YT.PlayerState.ENDED === 0
      if (event.data === YT.PlayerState.ENDED) {
        clearSafetyTimeout();
        resumePresentation();
      }
    }

    function onPlayerError(event) {
      console.warn('[TV Kiosk] YouTube Player error code ' + event.data + ' encountered. Auto-skipping to slides.');
      clearSafetyTimeout();
      resumePresentation();
    }

    /**
     * Extracts an 11-character YouTube Video ID from full URLs, Shorts URLs, or raw ID strings
     */
    function extractYouTubeId(urlOrId) {
      if (!urlOrId) return '';
      if (urlOrId.length === 11 && !urlOrId.includes('/') && !urlOrId.includes('?')) {
        return urlOrId;
      }
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
      const match = urlOrId.match(regExp);
      return (match && match[2].length === 11) ? match[2] : urlOrId;
    }

    /**
     * Formats seconds into MM:SS display
     */
    function formatTime(totalSeconds) {
      const mins = Math.floor(totalSeconds / 60);
      const secs = Math.floor(totalSeconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function initializeKiosk() {
      if (CONFIG.SLIDES_URL) {
        elements.iframe.src = CONFIG.SLIDES_URL;
      }

      if (CONFIG.SHOW_CORNER_INDICATOR) {
        elements.statusBadge.classList.remove('opacity-0');
        elements.statusBadge.classList.add('opacity-100');
      }

      // Periodically refresh the background presentation iframe to prevent memory buildup
      if (CONFIG.RELOAD_SLIDES_INTERVAL_HOURS > 0) {
        const refreshMs = CONFIG.RELOAD_SLIDES_INTERVAL_HOURS * 60 * 60 * 1000;
        state.slidesRefreshTimerId = setInterval(() => {
          if (!state.isOverlayActive) {
            console.log('[TV Kiosk] Executing scheduled presentation refresh to prevent memory leaks.');
            elements.iframe.src = elements.iframe.src;
          }
        }, refreshMs);
      }

      if (CONFIG.AUTO_START) {
        startKioskTimer();
      }
    }

    function startKioskTimer() {
      if (state.timerId) clearInterval(state.timerId);

      state.timerId = setInterval(() => {
        if (!state.isOverlayActive) {
          state.countdownSeconds--;

          if (CONFIG.SHOW_CORNER_INDICATOR) {
            elements.statusTitle.textContent = "Slides Active";
            elements.statusTimer.textContent = `Next video: ${formatTime(state.countdownSeconds)}`;
          }

          if (state.countdownSeconds <= 0) {
            triggerVideoOverlay();
          }
        }
      }, 1000);
    }

    function triggerVideoOverlay() {
      if (!CONFIG.VIDEO_SOURCES || CONFIG.VIDEO_SOURCES.length === 0) return;

      state.isOverlayActive = true;
      const item = CONFIG.VIDEO_SOURCES[state.currentVideoIndex];
      state.activePlayerType = item.type;

      // Update corner status badge
      if (CONFIG.SHOW_CORNER_INDICATOR) {
        elements.statusDot.className = "h-2.5 w-2.5 rounded-full bg-amber-500";
        elements.statusPulse.className = "absolute h-4 w-4 rounded-full bg-amber-500/40 animate-pulse-ring";
        elements.statusTitle.textContent = "Video Break";
        elements.statusTimer.textContent = "Playing...";
      }

      // Safety fallback: if video fails or hangs for 8 seconds without triggering PLAYING, auto-resume slides
      setSafetyTimeout(8000);

      // Smoothly fade in overlay
      elements.overlay.classList.remove('opacity-0', 'pointer-events-none');
      elements.overlay.classList.add('opacity-100', 'pointer-events-auto');

      if (item.type === 'youtube') {
        playYouTubeVideo(item);
      } else {
        playMp4Video(item);
      }

      // Advance queue index sequentially
      state.currentVideoIndex = (state.currentVideoIndex + 1) % CONFIG.VIDEO_SOURCES.length;
    }

    function playMp4Video(item) {
      elements.ytContainer.classList.add('hidden');
      elements.mp4Player.classList.remove('hidden');
      elements.videoBadgeText.textContent = "Scheduled Video Break (MP4)";

      elements.mp4Source.src = item.url;
      elements.mp4Player.load();
      elements.mp4Player.currentTime = 0;
      
      // Force muted playback if configured or unattended
      elements.mp4Player.muted = CONFIG.MUTE_VIDEO && !state.userInteracted;

      const playPromise = elements.mp4Player.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          clearSafetyTimeout();
        }).catch(err => {
          console.warn('[TV Kiosk] Unmuted MP4 autoplay blocked. Falling back to muted playback.', err);
          elements.mp4Player.muted = true;
          elements.mp4Player.play()
            .then(() => clearSafetyTimeout())
            .catch(() => resumePresentation());

          if (!state.userInteracted) {
            elements.autoplayNotice.classList.remove('hidden');
          }
        });
      }
    }

    function playYouTubeVideo(item) {
      elements.mp4Player.classList.add('hidden');
      elements.ytContainer.classList.remove('hidden');
      elements.videoBadgeText.textContent = "Scheduled Video Break (YouTube)";

      const ytId = extractYouTubeId(item.id || item.url);

      if (state.ytPlayerReady && state.ytPlayer) {
        // ALWAYS start muted for 100% reliable unattended YouTube playback
        state.ytPlayer.mute();

        // Load and play video by ID
        state.ytPlayer.loadVideoById({
          videoId: ytId,
          suggestedQuality: 'large'
        });

      } else {
        console.warn('[TV Kiosk] YouTube IFrame API not ready yet. Skipping to slides.');
        resumePresentation();
      }
    }

    function setSafetyTimeout(ms) {
      clearSafetyTimeout();
      state.safetyTimeoutId = setTimeout(() => {
        console.warn('[TV Kiosk] Safety timeout triggered (video failed to start in time). Resuming slides.');
        resumePresentation();
      }, ms);
    }

    function clearSafetyTimeout() {
      if (state.safetyTimeoutId) {
        clearTimeout(state.safetyTimeoutId);
        state.safetyTimeoutId = null;
      }
    }

    function resumePresentation() {
      if (!state.isOverlayActive) return;

      clearSafetyTimeout();
      state.isOverlayActive = false;

      // Stop current active video player
      if (state.activePlayerType === 'youtube' && state.ytPlayer && state.ytPlayer.stopVideo) {
        try {
          state.ytPlayer.stopVideo();
        } catch(e) {}
      } else {
        elements.mp4Player.pause();
      }

      // Smoothly fade out overlay
      elements.overlay.classList.remove('opacity-100', 'pointer-events-auto');
      elements.overlay.classList.add('opacity-0', 'pointer-events-none');

      // Hide active player containers
      elements.mp4Player.classList.add('hidden');
      elements.ytContainer.classList.add('hidden');

      // Reset countdown timer
      state.countdownSeconds = Math.round(CONFIG.INTERVAL_MINUTES * 60);

      // Reset status badge
      if (CONFIG.SHOW_CORNER_INDICATOR) {
        elements.statusDot.className = "h-2.5 w-2.5 rounded-full bg-emerald-500";
        elements.statusPulse.className = "absolute h-4 w-4 rounded-full bg-emerald-500/40 animate-pulse-ring";
        elements.statusTitle.textContent = "Slides Active";
        elements.statusTimer.textContent = `Next video: ${formatTime(state.countdownSeconds)}`;
      }
    }

    function handleUserGestureClick() {
      state.userInteracted = true;
      elements.mp4Player.muted = false;
      if (state.ytPlayer && state.ytPlayer.unMute) {
        try {
          state.ytPlayer.unMute();
        } catch(e) {}
      }
      elements.autoplayNotice.classList.add('hidden');
    }

    // MP4 Video Event Listeners
    elements.mp4Player.addEventListener('ended', () => resumePresentation());
    elements.mp4Player.addEventListener('error', () => {
      console.warn('[TV Kiosk] MP4 load error. Skipping break.');
      resumePresentation();
    });

    // Capture screen click to enable user-authenticated unmuting if desired
    window.addEventListener('click', () => {
      if (!state.userInteracted) {
        state.userInteracted = true;
        elements.autoplayNotice.classList.add('hidden');
      }
    });

    // Boot kiosk application on DOM load
    window.addEventListener('DOMContentLoaded', () => initializeKiosk());
  </script>
</body>
</html>
